    - region [ref=e586]:
      - generic [ref=e588]:
        - heading "Ready to Buy Engagement Rings — Your Moment, Without the Wait" [level=2] [ref=e589]
        - paragraph [ref=e590]: Planning to propose soon, or simply found the one you can’t wait to give? Our ready to buy engagement rings are designed for exactly that moment.
        - button "The Aurora Standard — Ready to Ship Collection" [ref=e591]
        - region "The Aurora Standard — Ready to Ship Collection":
          - generic [ref=e596]:
            - paragraph [ref=e597]: At Aurora Saigon, we offer a carefully curated selection of engagement rings, available immediately without the wait for custom production. From timeless solitaires to refined halo and vintage-inspired designs, each piece is chosen for its balance, beauty, and enduring style.
            - paragraph [ref=e598]: Each ring is crafted using premium materials and set with carefully selected natural diamonds, natural sapphires, or lab-grown diamonds, and finished by skilled artisans with the same level of care we bring to our bespoke pieces. While these rings are ready to buy, they are never rushed — each one reflects our commitment to precision, proportion, and lasting quality.
            - heading "A Ring You Can Choose With Confidence" [level=3] [ref=e599]
            - paragraph [ref=e600]: Our ready to buy collection allows you to experience the process in a more immediate way — explore, select, and receive a ring that feels right, without compromise.
            - paragraph [ref=e601]: If you would like guidance, we are always here to help. Whether you visit our boutique or speak with us directly, we can walk you through the details — from gemstone quality to design proportions — so you feel completely confident in your choice.
            - paragraph [ref=e602]: Every piece is created with a focus on quality, craftsmanship, and responsible sourcing, offering a modern yet considered approach to fine jewelry.
            - heading "Visit Us or Explore Online" [level=3] [ref=e603]
            - paragraph [ref=e604]: You are welcome to explore our collection online or visit our boutique for a more personal experience. If you would like to refine a design or create something entirely bespoke, we are always happy to guide you through a custom process as well.
            - paragraph [ref=e605]: However you choose to begin, we are here to help you find a ring that feels considered, personal, and ready for the moment that matters most.
