      - generic [ref=f1e27]:
        - paragraph [ref=f1e28]: "At Aurora, we understand that many gemstones carry deep sentimental value or have been passed down through generations. We are pleased to create a new piece of jewellery using a gemstone supplied by the customer, subject to the following terms and conditions:"
        - paragraph [ref=f1e29]: 1. Gemstone Inspection and Assessment
        - paragraph [ref=f1e30]: Before production begins, Aurora will inspect the gemstone to assess its suitability for the intended design. Where necessary, we may recommend adjustments to the design to ensure the safety, durability, and overall integrity of the finished piece.
        - paragraph [ref=f1e31]: 2. Emerald Gemstones and Mounted Gemstones
        - heading "Emerald Gemstones" [level=3] [ref=f1e32]
        - paragraph [ref=f1e33]: Due to their natural inclusions and inherent fragility, emeralds are significantly more susceptible to damage during handling and setting than most other gemstones. For this reason, Aurora Saigon is unable to accept customer-supplied emeralds for use in our jewellery.
        - heading "Mounted Gemstones" [level=3] [ref=f1e34]
        - paragraph [ref=f1e35]:
          - text: Aurora Saigon only accepts customer-supplied gemstones that are
          - strong [ref=f1e36]: loose and unmounted
          - text: . We are unable to accept gemstones that are already set in jewellery.
        - paragraph [ref=f1e37]: Removing a gemstone from an existing ring, pendant, or other jewellery carries an increased risk of chipping, cracking, or other damage. To protect both our customers and our craftsmen, we do not undertake the removal of customer-owned gemstones from existing jewellery. Any gemstone supplied to Aurora Saigon must be loose prior to submission.
        - paragraph [ref=f1e38]: 2. Responsibility for Customer-Supplied Gemstones
        - paragraph [ref=f1e39]: Aurora will handle every customer-supplied gemstone with the utmost care throughout the manufacturing process.
        - paragraph [ref=f1e40]: However, as these gemstones may have been previously worn, set, repaired, or cut, they may contain internal inclusions, fractures, stress points, or other natural characteristics that cannot be detected through visual inspection alone. These inherent conditions may increase the risk of damage during removal, setting, or manufacturing.
        - paragraph [ref=f1e41]: Accordingly, Aurora cannot accept liability for any damage resulting from the gemstone’s pre-existing condition, inherent characteristics, or factors beyond our reasonable control.
        - paragraph [ref=f1e42]: 3. Insurance and Liability
        - paragraph [ref=f1e43]: Aurora does not provide insurance coverage or compensation for customer-supplied gemstones. Customers are encouraged to carefully consider whether they wish to use gemstones of significant financial or sentimental value.
        - paragraph [ref=f1e44]: 4. Handover Record and Customer Acknowledgement
        - paragraph [ref=f1e45]: When a gemstone is entrusted to Aurora, both parties will complete and sign a Gemstone Handover Form, recording the gemstone’s description, quantity, dimensions, current condition, distinguishing characteristics, and photographs where appropriate.
        - paragraph [ref=f1e46]: In addition, the customer will be required to sign a Customer Acknowledgement and Liability Waiver, confirming that they have read, understood, and accepted Aurora’s Customer-Supplied Gemstone Policy, including the inherent risks associated with working on customer-owned gemstones.
        - paragraph [ref=f1e47]: 5. Quality of the Finished Piece
        - paragraph [ref=f1e48]: Aurora applies the same high standards of craftsmanship to every piece we create. However, the final result may be influenced by the condition, dimensions, proportions, and characteristics of the customer-supplied gemstone.
        - paragraph [ref=f1e49]: 6. Customer Acceptance
        - paragraph [ref=f1e50]: By signing the Gemstone Handover Form and entrusting a gemstone to Aurora, the customer acknowledges that they have read, understood, and agreed to the terms and conditions set out in this policy.
