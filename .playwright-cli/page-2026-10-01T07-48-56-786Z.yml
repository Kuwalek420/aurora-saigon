  - main [ref=f2e13]:
    - generic [ref=f2e14]:
      - heading [level=1] [ref=f2e15]:
        - text: 5 Reasons Why
        - emphasis [ref=f2e16]: Aurora Saigon
      - img "Pear-shaped gemstone rings by Aurora Saigon" [ref=f2e17]
      - paragraph [ref=f2e18]: At Aurora, we believe that meaningful jewellery is more than the sum of its parts. Our customers love our genuine gemstones and modern iconic designs, but they also love our jewellery for the way a piece of jewellery makes you feel, the meaning behind the stone, and all lovingly designed in Ho Chi Minh City and handcrafted in Bangkok!
      - generic [ref=f2e19]:
        - generic [ref=f2e20]:
          - figure [ref=f2e21]:
            - img "beautiful aurora saigon jewellery" [ref=f2e22]
          - generic [ref=f2e23]:
            - paragraph [aria-hidden] [ref=f2e24]: "01"
            - heading "Gems as authentic as you are" [level=2] [ref=f2e25]
            - paragraph [ref=f2e26]: Fall in love with jewellery as authentic as you are. Aurora fans are crushing on our ethereal polished gemstones and one-of-a-kind raw crystals. From birthstone jewellery to Millennial approved engagement rings, authentic gemstones bring personal meaning and metaphysical power in ways that only the real thing can. We exclusively use natural gemstones in every piece we sell because real women call for real gems.
        - generic [ref=f2e27]:
          - figure [ref=f2e28]:
            - img "pear gemstone rings and pear shaped moonstone pendant from Aurora Saigon" [ref=f2e29]
          - generic [ref=f2e30]:
            - paragraph [aria-hidden] [ref=f2e31]: "02"
            - heading "Unique & iconic designs" [level=2] [ref=f2e32]
            - paragraph [ref=f2e33]: Build a jewelry collection that goes beyond the basics. Women are obsessing over our glammed up stacking rings, and hopping on waitlists to get their hands on our latest styles. We release new jewelry for pre-order to give our most loyal fans first access to fresh styles. With our approachable pricing and pieces designed to mix and match, it’s easier than ever to shop for inspiring jewelry that elevates your everyday look.
        - generic [ref=f2e34]:
          - figure [ref=f2e35]:
            - img "Moonstone collection from aurora saigon" [ref=f2e36]
          - generic [ref=f2e37]:
            - paragraph [aria-hidden] [ref=f2e38]: "03"
            - heading "Surprisingly affordable prices" [level=2] [ref=f2e39]
            - paragraph [ref=f2e40]: Treat yourself to stunning gemstone jewellery without the splurge. At Aurora, we believe in making jewellery more accessible for everyone. Our unique business model enables us to bring gorgeous, high quality jewellery straight to your door for less than you’d expect. Since we don’t have expensive storefronts and only offer jewellery that our customers adore, we can create for less, reduce waste, and keep our prices fair.
        - generic [ref=f2e41]:
          - figure [ref=f2e42]:
            - img "certification of gemstones available at Aurora Saigon Vietnam Ho Chi Minh" [ref=f2e43]
          - generic [ref=f2e44]:
            - paragraph [aria-hidden] [ref=f2e45]: "04"
            - heading "Independent gemmology lab certification" [level=2] [ref=f2e46]
            - paragraph [ref=f2e47]: At Aurora, all our gemstones are sent for evaluation at an independent gemmology lab to make sure all our jewellery is authentic. There are no hidden surprises and we go beyond what any other jewellery brand does and provides you with the actual certificate from the gemmology lab. All the spiritual meaning and mystical powers of gemstones can only come from authentic items. Unlike some other brands, who just test one item in a batch, we test them all! This is how we believe the jewellery industry should be. Far too often jewellery brands hide the quality of the gemstones with highly treated products or even try to sell fake synthetic stones as natural and real.
        - generic [ref=f2e48]:
          - figure [ref=f2e49]:
            - img "Best quality oval Swiss Blue Topaz ring with stunning white topaz set shank." [ref=f2e50]
          - generic [ref=f2e51]:
            - paragraph [aria-hidden] [ref=f2e52]: "05"
            - heading "Trust & amazing service" [level=2] [ref=f2e53]
            - paragraph [ref=f2e54]: When you join the Aurora community, you’re connected with like-minded fashion lovers who rave about our personalised service and swoon over our beautiful designs. We’ve built our brand on transparency and trust, and our friendly team is always ready to assist with your order and make sure your experience is as perfect as possible.
      - button "Book Private Viewing in Thảo Điền" [ref=f2e56]
