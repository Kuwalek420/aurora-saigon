      - generic [ref=f2e74]:
        - heading "Aurora Saigon Brand & Values" [level=2] [ref=f2e75]
        - generic [ref=f2e76]:
          - paragraph [ref=f2e77]: After spending many years in Vietnam, I realised that the jewellery shopping experience here feels frustrating. Many retailers focus on making a quick profit rather than building trust or offering good service. This often results in customers facing dishonesty and unclear information. Buying jewellery in Vietnam can feel like a risky gamble, and many people feel unsure about their purchases.
          - paragraph [ref=f2e78]: With years of experience in the jewellery industry, we've successfully built and managed an export business that serves the UK market. Throughout this journey, we've learned the importance of staying on top of market trends, maintaining high quality, and fostering strong relationships with partners and clients. Our passion lies in offering exceptional products.
          - paragraph [ref=f2e79]: Our return policies and warranties exceed what's typically expected in Vietnam and align more closely with UK Consumer Law. These policies form the foundation of Aurora Saigon's commitment to customer satisfaction.
          - paragraph [ref=f2e80]: We are excited to introduce this revolutionary shopping experience to Vietnam. We aim to create a modern, transparent, and superior way to buy jewellery, where every customer feels supported and well-informed throughout their journey with us. We believe it's time for a new era of jewellery shopping in Vietnam, one where trust, care, and quality take centre stage.
        - paragraph [ref=f2e81]:
          - text: "- Nick"
          - generic [ref=f2e82]: Founder of Aurora Saigon Jewellery
