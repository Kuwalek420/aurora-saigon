      - generic [ref=f1e28]:
        - paragraph [ref=f1e29]: At Aurora Saigon, we stand behind the quality and craftsmanship of every piece we create. Our jewellery is expertly crafted in Bangkok, Thailand, using carefully selected materials and precise manufacturing techniques.
        - paragraph [ref=f1e30]:
          - text: We are proud to offer a
          - strong [ref=f1e31]: Lifetime Manufacturing Warranty
          - text: on eligible items, covering defects in materials and workmanship under normal wear.
        - paragraph [ref=f1e32]: This warranty is provided in addition to your statutory consumer rights.
        - heading "Warranty Coverage by Product Type" [level=3] [ref=f1e33]
        - heading "Rings – Engagement, Wedding & Fashion" [level=4] [ref=f1e34]
        - paragraph [ref=f1e35]: All our engagement rings are covered by a lifetime warranty, ensuring long-term quality and peace of mind.
        - paragraph [ref=f1e36]:
          - strong [ref=f1e37]: "Coverage:"
          - text: Lifetime Manufacturing Warranty from the date of receipt.
        - paragraph [ref=f1e38]:
          - strong [ref=f1e39]: "What’s Covered:"
        - list [ref=f1e40]:
          - listitem [ref=f1e41]: Porosity, surface imperfections, or visible blemishes in the metal
          - listitem [ref=f1e42]: Uneven or misaligned settings identified at delivery or during servicing
          - listitem [ref=f1e43]: Chips, nicks, or surface defects in stones identified at delivery or during servicing
          - listitem [ref=f1e44]: Plating defects, including uneven rhodium application, identified at delivery or during servicing
        - paragraph [ref=f1e45]:
          - strong [ref=f1e46]: "Remedy:"
          - text: Confirmed manufacturing defects will be repaired or replaced at no cost.
        - heading "Fine Jewellery – Earrings, Chains, Bracelets & Pendants" [level=4] [ref=f1e47]
        - paragraph [ref=f1e48]:
          - strong [ref=f1e49]: "Coverage:"
          - text: 2-Year Manufacturing Warranty from the date of receipt.
        - paragraph [ref=f1e50]:
          - strong [ref=f1e51]: "What’s Covered:"
          - text: Manufacturing defects affecting the structure or function of the piece. These are typically evident within the early period of wear.
        - paragraph [ref=f1e52]:
          - strong [ref=f1e53]: "Remedy:"
          - text: Defective items will be repaired or replaced free of charge within the warranty period.
        - paragraph [ref=f1e54]:
          - strong [ref=f1e55]: "After 2 Years:"
          - text: Repairs may still be offered; however, costs will be assessed on a case-by-case basis.
        - heading "Gemstones – Lab Diamonds, Moissanite & Sapphires" [level=4] [ref=f1e56]
        - paragraph [ref=f1e57]: Our gemstones, including natural diamonds, lab-grown diamonds, moissanite, and sapphires, are carefully selected for exceptional quality and brilliance. Browse our collection of loose lab-grown diamonds to choose the perfect centre stone for your design.
        - paragraph [ref=f1e58]:
          - strong [ref=f1e59]: "Coverage:"
          - text: Lifetime Manufacturing Warranty covering the stone characteristics selected at the time of purchase.
        - paragraph [ref=f1e60]:
          - strong [ref=f1e61]: "What’s Covered:"
          - text: Issues relating to the original manufacturing or setting of the stone.
        - paragraph [ref=f1e62]:
          - strong [ref=f1e63]: "Exclusions:"
        - list [ref=f1e64]:
          - listitem [ref=f1e65]: General wear and tear
          - listitem [ref=f1e66]: Chipping, cracking, or breakage due to impact
          - listitem [ref=f1e67]: Accidental damage or mishandling
          - listitem [ref=f1e68]: Loss or theft
        - heading "What Is Not Covered" [level=3] [ref=f1e69]
        - paragraph [ref=f1e70]: "This warranty does not cover:"
        - list [ref=f1e71]:
          - listitem [ref=f1e72]: Normal wear and tear, including scratches, dents, and surface wear
          - listitem [ref=f1e73]: Damage caused by impact, accidents, misuse, or improper care
          - listitem [ref=f1e74]: Loss or theft
          - listitem [ref=f1e75]: Repairs, resizing, or alterations carried out by third parties
        - heading "Lifetime Cleaning & Servicing" [level=3] [ref=f1e76]
        - paragraph [ref=f1e77]:
          - text: To help maintain the beauty and integrity of your jewellery, Aurora Saigon offers
          - strong [ref=f1e78]: complimentary lifetime cleaning and inspection services
          - text: .
        - paragraph [ref=f1e79]:
          - strong [ref=f1e80]: "What’s Included:"
        - list [ref=f1e81]:
          - listitem [ref=f1e82]: Professional cleaning to restore shine and brilliance
          - listitem [ref=f1e83]: Inspection of stone settings and overall structure
          - listitem [ref=f1e84]: Basic maintenance checks to help ensure continued wearability
        - paragraph [ref=f1e85]:
          - strong [ref=f1e86]: "Service Frequency:"
          - text: Available once per year per item.
        - paragraph [ref=f1e87]:
          - strong [ref=f1e88]: "Important Notes:"
        - list [ref=f1e89]:
          - listitem [ref=f1e90]:
            - text: Jewellery must be brought to our
