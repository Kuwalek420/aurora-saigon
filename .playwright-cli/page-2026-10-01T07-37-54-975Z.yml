            - text: for servicing
          - listitem [ref=f1e92]: This service does not include repairs for damage, wear and tear, or non-manufacturing issues
          - listitem [ref=f1e93]: Any additional work required will be quoted and approved before proceeding
        - heading "Consumer Rights" [level=3] [ref=f1e94]
        - paragraph [ref=f1e95]: This warranty is provided in addition to your rights under applicable consumer laws. Nothing in this policy limits or replaces your statutory protections.
        - heading "How to Make a Claim" [level=3] [ref=f1e96]
        - paragraph [ref=f1e97]: "If you believe your item has a manufacturing defect, please follow these steps:"
        - paragraph [ref=f1e98]:
          - text: "1."
          - strong [ref=f1e99]: Contact us
          - text: with your proof of purchase and a description of the issue. 2.
          - strong [ref=f1e100]: Send or bring the item
          - text: to us for inspection. 3.
          - strong [ref=f1e101]: Assessment
          - text: – our team will determine whether the issue is covered. 4.
          - strong [ref=f1e102]: Resolution
          - text: – approved claims will be repaired or replaced free of charge.
        - paragraph [ref=f1e103]: If the issue falls outside warranty coverage, a repair quote will be provided before any work is carried out.
        - heading "Jewellery Care" [level=3] [ref=f1e104]
        - paragraph [ref=f1e105]: "To preserve the longevity of your jewellery, we recommend the following care tips:"
        - list [ref=f1e106]:
          - listitem [ref=f1e107]: Remove jewellery during activities involving impact or exposure to chemicals
          - listitem [ref=f1e108]: Clean gently using mild soap and water
          - listitem [ref=f1e109]: Store pieces separately in a soft pouch or jewellery box
        - heading "Our Promise" [level=3] [ref=f1e110]
        - paragraph [ref=f1e111]: Our warranty and aftercare services reflect our confidence in the quality of our craftsmanship and our commitment to your long-term satisfaction.
        - heading "FAQ" [level=2] [ref=f1e112]
        - paragraph [ref=f1e113]: Your questions, answered.
        - heading "What does your jewellery warranty cover?" [level=4] [ref=f1e114]
        - paragraph [ref=f1e115]: Our warranty covers manufacturing defects in materials and craftsmanship. This includes issues such as loose settings, faulty clasps, or structural defects under normal wear. It does not cover damage caused by accidents, misuse, or general wear and tear.
        - heading "How long is the warranty on engagement rings?" [level=4] [ref=f1e116]
        - paragraph [ref=f1e117]: Our engagement rings come with a lifetime warranty covering manufacturing defects. We also offer ongoing support and maintenance services to ensure your ring remains in excellent condition over time.
        - heading "Does the warranty cover resizing or adjustments?" [level=4] [ref=f1e118]
        - paragraph [ref=f1e119]: We offer complimentary resizing within a specified range after purchase. While resizing is not considered a warranty repair, we provide this service to ensure the perfect fit. Additional resizing requests may incur a small fee depending on the design.
        - heading "Are lab-grown diamonds covered under warranty?" [level=4] [ref=f1e120]
        - paragraph [ref=f1e121]: Yes, lab-grown diamonds are covered under the same warranty as natural diamonds. This includes protection against manufacturing defects in the setting, ensuring your diamond remains secure.
        - heading "What is not covered under the jewellery warranty?" [level=4] [ref=f1e122]
        - paragraph [ref=f1e123]: The warranty does not cover damage caused by accidental impact, improper care, loss of stones, or normal wear such as scratches and fading. We recommend regular maintenance to keep your jewellery in optimal condition.
        - heading "Do you offer free cleaning and maintenance services?" [level=4] [ref=f1e124]
        - paragraph [ref=f1e125]: Yes, we offer complimentary cleaning and inspection services to help maintain the brilliance and integrity of your jewellery. Regular maintenance ensures that your ring remains secure and beautiful over time.
        - heading "Is my jewellery warranty valid internationally?" [level=4] [ref=f1e126]
        - paragraph [ref=f1e127]: Yes, our warranty is valid internationally. If you are located outside Vietnam, you can contact us to arrange secure shipping for inspection and repair services.
        - heading "How do I make a warranty claim for my ring?" [level=4] [ref=f1e128]
        - paragraph [ref=f1e129]: To make a warranty claim, simply contact our team with your order details and a description of the issue. We will guide you through the next steps, including inspection and repair if required.
        - heading "Can I repair my engagement ring if it is damaged?" [level=4] [ref=f1e130]
        - paragraph [ref=f1e131]: Yes, we offer professional repair services for all our jewellery. Even if the damage is not covered under warranty, our expert craftsmen can restore your ring to its original beauty.
        - heading "Do I need to service my ring regularly to maintain the warranty?" [level=4] [ref=f1e132]
        - paragraph [ref=f1e133]: We recommend periodic inspections and cleaning to maintain your ring’s condition. While regular servicing is not always mandatory, it helps identify potential issues early and ensures long-term durability.
