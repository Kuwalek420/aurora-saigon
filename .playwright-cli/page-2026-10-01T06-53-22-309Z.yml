            - paragraph [ref=f2e38]: We offer a selection of fine metals including 9k, 14k, and 18k gold in white, yellow, and rose tones, as well as platinum for those seeking a premium, naturally white finish.
          - listitem [ref=f2e39]:
            - heading [level=3] [ref=f2e40]:
              - button "Where are your rings manufactured?" [ref=f2e41]
            - paragraph [ref=f2e45]: All of our jewellery is crafted in our dedicated workshop in Bangkok, Thailand—a global hub for fine jewellery manufacturing. Thailand is renowned for its highly skilled artisans, generations of craftsmanship expertise, and exceptional attention to detail, particularly in gemstone setting and gold work. By producing in Bangkok, we are able to combine traditional hand-finishing techniques with modern precision, ensuring consistently high quality while maintaining better control over production and value for our customers.
          - listitem [ref=f2e46]:
            - heading [level=3] [ref=f2e47]:
              - button "Are your diamonds and gemstones natural or lab-grown?" [ref=f2e48]
            - paragraph [ref=f2e52]: We offer both lab-grown diamonds and natural diamonds, giving you the flexibility to choose based on your preferences, values, and budget.
          - listitem [ref=f2e53]:
            - heading [level=3] [ref=f2e54]:
              - button "Do you offer custom or made-to-order jewellery?" [ref=f2e55]
            - paragraph [ref=f2e59]: Yes, we specialise in custom and made-to-order jewellery. Each piece can be tailored to your preferences, including the design, metal, gemstone, and finishing details. Whether you’re creating an engagement ring or adapting one of our existing designs, our team will guide you through the process—from initial concept to final craftsmanship—to ensure the piece is uniquely yours.
